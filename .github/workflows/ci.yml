name: CI
on:
  push:
    branches: [main]
  pull_request: # 1. also run for pull requests into main
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install flake8 
        run: pip install flake8 
      - name: Run flake8
        run: flake8 pricing.py tests/
 
  ready:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: All ready
        run: echo "Lint and all tests passed. Ready to merge"
