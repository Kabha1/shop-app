name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v --cov=pricing --cov-report=term-missing --cov-report=markdown:coverage.md --cov-fail-under=90
      - name: Coverage summary
        if: always()
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
  security:
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: Scan the code (Bandit)
        run: bandit -r . -x ./tests
      - name: Scan the dependencies (pip-audit)
        run: pip-audit -r requirements.txt
  ready:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - name: All ready
        run: echo "Lint and all tests passed. Ready to merge."
