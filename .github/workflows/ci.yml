name: CI
on:
  push:
    branches: [main]
  pull_request: # 1. also run for pull requests into main
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt # 2. install everything listed in requirements.txt
      - name: Run tests
        run: pytest -v # 3. run pytest and show each test name
